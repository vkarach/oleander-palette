<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oleander Palette</title>
<meta name="description" content="Oleander: a rose and maroon dark color palette.">
<meta name="theme-color" content="#3b1e21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b55f6c'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-deep: #301212;
    --bg: #3b1e21;
    --bg-raised: #4d2a2d;
    --bg-panel: #4e2b2e;
    --accent: #b55f6c;
    --accent-deep: #ad324a;
    --accent-light: #dc8e9c;
    --text: #f5f5f5;
    --text-muted: #906e74;
    --hairline: rgba(245, 245, 245, .08);
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg-deep); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 56px 20px 72px; }

  header h1 { margin: 0 0 8px; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--accent-light); font-size: 17px; }

  .strip { display: flex; height: 64px; margin: 32px 0 8px; border-radius: 14px; overflow: hidden; border: 1px solid var(--hairline); }
  .strip i { flex: 1; }

  section { margin-top: 44px; }
  h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card {
    appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--bg); border: 1px solid var(--hairline); border-radius: 14px; padding: 0; overflow: hidden;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
  .swatch { height: 112px; display: flex; align-items: flex-end; padding: 12px 14px; font-family: var(--mono); font-size: 13px; }
  .swatch span { opacity: 0; transition: opacity .15s ease; }
  .card:hover .swatch span, .card:focus-visible .swatch span { opacity: .85; }
  .meta { padding: 12px 14px 14px; }
  .meta b { display: block; font-size: 15px; font-weight: 600; }
  .meta .hex { font-family: var(--mono); font-size: 13px; color: var(--accent-light); }
  .meta .use { display: block; margin-top: 4px; font-size: 13px; color: var(--text-muted); }

  .export { background: var(--bg); border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden; }
  .export .bar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  .tab, .copy {
    appearance: none; font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
    background: transparent; border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 12px;
  }
  .tab[aria-selected="true"] { background: var(--bg-panel); border-color: var(--accent); }
  .copy { margin-left: auto; background: var(--accent-deep); border-color: var(--accent-deep); }
  .tab:hover { border-color: var(--accent); }
  .copy:hover { filter: brightness(1.12); }
  .tab:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
  pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--text); }

  footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--hairline); color: var(--text-muted); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--accent-light); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent-deep); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  #toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .card, #toast, .swatch span { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </header>
  <div class="strip" id="strip" aria-hidden="true"></div>
  <div id="groups"></div>

  <section>
    <h2>Export</h2>
    <div class="export">
      <div class="bar" role="tablist">
        <button class="tab" role="tab" data-fmt="css" aria-selected="true">CSS</button>
        <button class="tab" role="tab" data-fmt="json" aria-selected="false">JSON</button>
        <button class="copy" id="copyExport" type="button">Copy</button>
      </div>
      <pre id="exportOut"></pre>
    </div>
  </section>

  <footer>
    <a href="https://github.com/vkarach/oleander-palette">Source on GitHub</a>
    <a href="https://github.com/vkarach/oleander-palette/raw/main/palette/Oleander.tdesktop-palette">Telegram Desktop theme file</a>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const PALETTE = __DATA__;

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const all = PALETTE.groups.flatMap(g => g.colors);

function onColor(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35 ? "#301212" : "#f5f5f5";
}

document.getElementById("title").textContent = PALETTE.name + " Palette";
document.getElementById("tagline").textContent = PALETTE.tagline;
document.getElementById("strip").innerHTML = all.map(c => `<i style="background:${c.hex}"></i>`).join("");

document.getElementById("groups").innerHTML = PALETTE.groups.map(g => `
  <section>
    <h2>${esc(g.title)}</h2>
    <div class="grid">
      ${g.colors.map(c => `
        <button class="card" type="button" data-hex="${c.hex}" aria-label="Copy ${esc(c.name)} ${c.hex}">
          <div class="swatch" style="background:${c.hex};color:${onColor(c.hex)}"><span>Copy</span></div>
          <div class="meta">
            <b>${esc(c.name)}</b>
            <span class="hex">${c.hex.toUpperCase()}</span>
            <span class="use">${esc(c.use)}</span>
          </div>
        </button>`).join("")}
    </div>
  </section>`).join("");

const exporters = {
  css: () => ":root {\n" + all.map(c => `  --oleander-${c.token}: ${c.hex};`).join("\n") + "\n}",
  json: () => JSON.stringify(Object.fromEntries(all.map(c => [c.token, c.hex])), null, 2),
};
let fmt = "css";
const out = document.getElementById("exportOut");
const renderExport = () => { out.textContent = exporters[fmt](); };
renderExport();

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  fmt = t.dataset.fmt;
  document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", String(o === t)));
  renderExport();
}));

const toast = document.getElementById("toast");
let timer;
function copy(text, label) {
  navigator.clipboard?.writeText(text).then(() => {
    toast.textContent = label;
    toast.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("on"), 1400);
  }).catch(() => {});
}
document.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) return copy(card.dataset.hex, card.dataset.hex.toUpperCase() + " copied");
  if (e.target.closest("#copyExport")) copy(out.textContent, fmt.toUpperCase() + " copied");
});
</script>
</body>
</html>
