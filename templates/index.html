<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oleander Palette</title>
<meta name="description" content="Oleander: a rose and maroon dark color palette.">
<meta name="theme-color" content="#3b1e21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b55f6c'/%3E%3C/svg%3E">
<style>
__STYLE__</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </header>

  <section>
    <h2>Main</h2>
    <div class="squares" id="main"></div>
  </section>

  <section>
    <h2>Matching</h2>
    <div class="squares" id="matching"></div>
  </section>

  <a class="more" href="details.html">Detailed map &rarr;</a>
  <a class="more ghost" href="playground.html">Playground &rarr;</a>

  <footer>
    <a href="https://github.com/vkarach/oleander-palette">Source on GitHub</a>
    <a href="https://github.com/vkarach/oleander-palette/raw/main/palette/Oleander.tdesktop-palette">Telegram Desktop theme file</a>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const PALETTE = __DATA__;

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function onColor(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35 ? "#301212" : "#f5f5f5";
}
const square = c => `
  <button class="sq" type="button" data-hex="${c.hex}" style="background:${c.hex};color:${onColor(c.hex)}" aria-label="Copy ${esc(c.name)} ${c.hex}">
    <b>${esc(c.name)}</b><span>${c.hex.toUpperCase()}</span>
  </button>`;

document.getElementById("title").textContent = PALETTE.name + " Palette";
document.getElementById("tagline").textContent = PALETTE.tagline;
document.getElementById("main").innerHTML = PALETTE.groups.flatMap(g => g.colors).map(square).join("");
document.getElementById("matching").innerHTML = PALETTE.matches.map(square).join("");

const toast = document.getElementById("toast");
let timer;
document.addEventListener("click", e => {
  const sq = e.target.closest(".sq");
  if (!sq) return;
  navigator.clipboard?.writeText(sq.dataset.hex).then(() => {
    toast.textContent = sq.dataset.hex.toUpperCase() + " copied";
    toast.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("on"), 1400);
  }).catch(() => {});
});
</script>
</body>
</html>
